# Hugo config for the Skrog docs site (#197).
#
# No theme. The layouts in site/layouts are about 200 lines of HTML and CSS,
# written here rather than pulled in, because a project that pins every byte
# it ships should not take a third-party theme -- with its own update cadence,
# its own supply chain and its own opinions -- to render 23 markdown files.
#
# content/ is generated by scripts/build-docs.ps1 from the docs/ directory, so
# docs/ stays the source of truth and keeps rendering on GitHub.
baseURL = "https://wslkit.github.io/skrog/"
locale = "en-gb"
title = "Skrog"
enableRobotsTXT = true

# No tags, no categories: 23 hand-curated pages in six groups do not need a
# second, weaker index.
disableKinds = ["taxonomy", "term", "rss"]

# The generator writes no dates; without this Hugo warns on every page.
[frontmatter]
  date = [":default", ":fileModTime"]

[markup.goldmark.renderer]
  # The docs contain no raw HTML today, and keeping it off means a stray
  # angle bracket in a code sample cannot become markup.
  unsafe = false

[markup.goldmark.renderHooks.link]
  # Hugo resolves a markdown link to another .md page itself. That is what
  # lets docs/ keep writing `audit.md` and have it work both on GitHub and
  # here, with no rewriting and no second syntax to remember.
  useEmbedded = "fallback"

[markup.highlight]
  noClasses = false
  style = "github"

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  repo = "https://github.com/wslkit/skrog"
  description = "Upstream Docker Engine on Windows via WSL2. No licence fees, no Electron."

# The brand marks live in assets/ at the repo root and are the same files the
# README uses. Mounting beats copying: there is no second copy to drift.
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  # The one-line installer (#77) is served from the docs site:
  #   irm https://wslkit.github.io/skrog/install.ps1 | iex
  # Mounted from scripts/ rather than copied into static/, so the file people
  # pipe into their shell is the same one that is reviewed in the repository.
  source = "../scripts/install.ps1"
  target = "static/install.ps1"
[[module.mounts]]
  source = "../assets/skrog-mark.svg"
  target = "static/skrog-mark.svg"
[[module.mounts]]
  source = "../assets/skrog-mark-ondark.svg"
  target = "static/skrog-mark-ondark.svg"
[[module.mounts]]
  # The link-preview card (og:image). Already rasterized by tools/genicons for
  # the GitHub social preview, so mounting it means one card, not two.
  source = "../assets/icons/social-preview.png"
  target = "static/social-preview.png"
[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "layouts"
  target = "layouts"
[[module.mounts]]
  source = "data"
  target = "data"
