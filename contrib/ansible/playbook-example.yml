---
# Converge a fleet of Windows CI runners onto one pinned engine (#143).
#
#   ansible-galaxy collection install ansible.windows
#   ansible-playbook -i inventory.ini contrib/ansible/playbook-example.yml
#
# Inventory needs WinRM or SSH reachability and an account with local admin (the
# machine PATH and the WSL import both need it). The engine is per-user: run
# this as the account the runner logs on as.
- name: Skrog runners
  hosts: windows_runners
  gather_facts: true
  roles:
    - role: ../roles/skrog
      vars:
        skrog_version: "0.4.0"
        # Same lock the developers commit, so laptop and runner run the same
        # dockerd, containerd, runc and BuildKit -- to the commit.
        skrog_lockfile_path: 'C:\ci\skrog.lock'
        skrog_config:
          idle-timeout: "0"          # a runner should not idle-stop mid-queue
          disk.warn-below: "20GiB"
        skrog_engine_config:
          registry-mirrors: "https://mirror.example.com"
          max-concurrent-downloads: "6"
        skrog_prewarm_images:
          - alpine:3.20
          - node:20-bookworm-slim
