---
# Converge a Windows host to "Hawser installed, engine imported, autostart
# registered, doctor clean". Idempotent: every task either checks first or is
# naturally idempotent, so a second run reports no changes.
#
# WSL2 must be present. Installing it needs a reboot, which a role should not
# take on its own initiative -- so this checks and fails with the fix rather
# than rebooting your fleet.

- name: Check WSL2 is available
  ansible.windows.win_command: wsl --status
  register: hawser_wsl_status
  changed_when: false
  failed_when: false

- name: Fail when WSL2 is missing
  ansible.builtin.fail:
    msg: >-
      WSL2 is not available on {{ inventory_hostname }}. Run
      `wsl --install --no-distribution` and reboot (or enable the
      Microsoft-Windows-Subsystem-Linux and VirtualMachinePlatform features),
      then run this role again.
  when: hawser_wsl_status.rc != 0

- name: Check the installed hawser version
  ansible.windows.win_command: '{{ hawser_home }}\bin\hawser.exe --version'
  register: hawser_installed
  changed_when: false
  failed_when: false

- name: Fetch the setup-hawser install script
  ansible.windows.win_get_url:
    url: https://raw.githubusercontent.com/zcsizmadia/setup-hawser/{{ hawser_setup_ref }}/scripts/install-hawser.ps1
    dest: '{{ ansible_env.TEMP }}\install-hawser.ps1'
    force: true
  when: hawser_version not in (hawser_installed.stdout | default(''))

- name: Install hawser.exe (verified against the release SHA256SUMS)
  ansible.windows.win_command: >-
    pwsh -NoProfile -File {{ ansible_env.TEMP }}\install-hawser.ps1
    -Version {{ hawser_version }} -Install:$false -Dest {{ hawser_home }}
  when: hawser_version not in (hawser_installed.stdout | default(''))
  notify: hawser installed

- name: Put hawser.exe on the machine PATH
  ansible.windows.win_path:
    elements: '{{ hawser_home }}\bin'
    scope: machine
    state: present

- name: Check whether the engine is already installed
  ansible.windows.win_command: '{{ hawser_home }}\bin\hawser.exe status --json'
  register: hawser_status
  changed_when: false
  failed_when: false

- name: Import the engine from an air-gap bundle
  ansible.windows.win_command: >-
    {{ hawser_home }}\bin\hawser.exe install --headless
    --offline {{ hawser_bundle_path }}
    {{ '' if hawser_autostart else '--no-autostart' }}
  when:
    - hawser_bundle_path | length > 0
    - '"\"installed\": true" not in (hawser_status.stdout | default(""))'

- name: Import the engine (downloading the pinned rootfs)
  ansible.windows.win_command: >-
    {{ hawser_home }}\bin\hawser.exe install --headless
    {{ ('--locked ' + hawser_lockfile_path) if hawser_lockfile_path | length > 0 else '' }}
    {{ '' if hawser_autostart else '--no-autostart' }}
  when:
    - hawser_bundle_path | length == 0
    - '"\"installed\": true" not in (hawser_status.stdout | default(""))'

# `hawser config set` is itself idempotent and reports the applied value; it
# also validates engine keys with `dockerd --validate` before they land.
- name: Apply Hawser settings
  ansible.windows.win_command: '{{ hawser_home }}\bin\hawser.exe config set {{ item.key }} {{ item.value }}'
  loop: '{{ hawser_config | dict2items }}'
  changed_when: true

- name: Apply engine settings
  ansible.windows.win_command: '{{ hawser_home }}\bin\hawser.exe config set engine.{{ item.key }} {{ item.value }}'
  loop: '{{ hawser_engine_config | dict2items }}'
  changed_when: true

- name: Register the logon autostart
  ansible.windows.win_command: '{{ hawser_home }}\bin\hawser.exe autostart enable'
  when: hawser_autostart
  changed_when: true

- name: Start the engine and wait for it to answer
  ansible.windows.win_command: '{{ hawser_home }}\bin\hawser.exe healthcheck --wait 3m'
  register: hawser_health
  until: hawser_health.rc == 0
  retries: 2
  delay: 10
  changed_when: false

- name: Pre-pull the pinned image list
  when: hawser_prewarm_images | length > 0
  block:
    - name: Write the prewarm list
      ansible.windows.win_copy:
        content: |
          {% for image in hawser_prewarm_images %}
          {{ image }}
          {% endfor %}
        dest: '{{ hawser_home }}\prewarm.txt'

    - name: Prewarm
      ansible.windows.win_command: '{{ hawser_home }}\bin\hawser.exe prewarm {{ hawser_home }}\prewarm.txt'
      changed_when: true

# Failures fail the play; warnings are reported and do not. The runner-setup
# check warns until auto-logon is configured, which this role deliberately
# leaves alone -- it would mean handling a password.
- name: Run hawser doctor
  ansible.windows.win_command: '{{ hawser_home }}\bin\hawser.exe doctor --json'
  register: hawser_doctor
  changed_when: false
  failed_when: hawser_doctor_gate and hawser_doctor.rc != 0

- name: Show the doctor report
  ansible.builtin.debug:
    var: hawser_doctor.stdout_lines
