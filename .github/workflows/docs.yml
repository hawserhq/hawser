# Build the documentation site and publish it to GitHub Pages (#197).
#
# Every pull request builds it, so a broken template or a nav entry pointing at
# a deleted page fails in review rather than on the live site. Only main
# deploys.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'assets/*.svg'
      # The link-preview card is mounted into the site too (hugo.toml), so a
      # regenerated mark has to reach /social-preview.png the same way.
      - 'assets/icons/social-preview.png'
      - 'scripts/build-docs.ps1'
      # install.ps1 is mounted into the site (hugo.toml) and served at
      # /install.ps1 -- the file people pipe into their shell. Without it
      # here, a fix to the installer merges and never reaches the URL.
      - 'scripts/install.ps1'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'assets/*.svg'
      # The link-preview card is mounted into the site too (hugo.toml), so a
      # regenerated mark has to reach /social-preview.png the same way.
      - 'assets/icons/social-preview.png'
      - 'scripts/build-docs.ps1'
      # install.ps1 is mounted into the site (hugo.toml) and served at
      # /install.ps1 -- the file people pipe into their shell. Without it
      # here, a fix to the installer merges and never reaches the URL.
      - 'scripts/install.ps1'
      - '.github/workflows/docs.yml'
  # So the site can be republished without a docs change -- after a transfer,
  # or when Pages itself needs a nudge.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, with its published checksum, for the same reason the engine rootfs
  # is: a build that silently changes under us is not reproducible. Bump both
  # lines together from https://github.com/gohugoio/hugo/releases.
  HUGO_VERSION: 0.166.0
  HUGO_SHA256: 45228f5a52eb118b0ca168068f01d7df0447314a24056f1d29667ed9fc368308

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install hugo
        run: |
          set -euo pipefail
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${tarball}"
          echo "${HUGO_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          hugo version

      # pwsh is preinstalled on ubuntu-latest, so the site is built by exactly
      # the script a contributor runs on Windows -- one code path, not two.
      # -Strict also fails on a docs page that no nav section lists: a page
      # reachable only by URL is a page nobody reads, and a pull request is
      # where that is cheap to fix.
      - name: build
        run: pwsh -File scripts/build-docs.ps1 -Strict

      - name: upload
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
