name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: gofmt
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) { Write-Host "gofmt needed:"; $bad; exit 1 }

      # An index is worth its worst link. Cheap to check, silently rots otherwise.
      - name: markdown links
        shell: pwsh
        run: pwsh -File scripts/check-links.ps1

      # docs/reference.md is generated from the binary's own --help (#209).
      # Editing a flag's help without regenerating would ship a reference that
      # describes the previous release, so the mismatch fails here instead.
      - name: command reference is current
        shell: pwsh
        run: pwsh -File scripts/build-reference.ps1 -Check

      # internal/release/manifest.json names rootfs tarballs published on this
      # repo's releases. Nothing offline can tell whether those URLs resolve --
      # and a rename pass once rewrote the published filenames, pointing every
      # install and rollback at a 404 while the offline tests stayed green.
      # Behind a build tag so `go test ./...` stays offline; run explicitly here.
      - name: manifest rootfs URLs resolve
        shell: pwsh
        run: go test -tags network -run TestPublishedRootfsURLsResolve ./internal/release/

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      # The Spike A relay is a separate throwaway module — keep it compiling
      # until the real pipeproxy replaces it, then this step goes away.
      # Spikes are separate throwaway modules, kept compiling so they stay
      # runnable until their issue closes and they are deleted.
      - name: build spike modules
        shell: pwsh
        run: |
          Get-ChildItem -Path spike -Recurse -Filter go.mod | ForEach-Object {
            $dir = $_.Directory.FullName
            Write-Host "== $dir"
            Push-Location $dir
            go mod tidy
            if ($LASTEXITCODE -ne 0) { Pop-Location; exit 1 }
            go build ./...
            if ($LASTEXITCODE -ne 0) { Pop-Location; exit 1 }
            Pop-Location
          }

  # #166: a supervisor serving the pipe died with Go runtime memory corruption
  # ("found pointer to free object"; "unknown caller pc" inside go-winio's IOCP
  # processor), leaving the engine unreachable until `skrog start`. The cause
  # was two goroutines sharing one bufio.Reader in the relay — invisible to
  # every other check in this file, and reproducible only as "crashes
  # eventually" on a real machine. The race detector turns that into a test
  # failure, so the pipe path runs under it on every PR.
  race:
    name: race & checkptr (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # -race needs cgo and a real C toolchain. The runner image ships
      # mingw-w64; printing it makes a missing compiler an obvious failure
      # rather than a confusing `# runtime/cgo` build error.
      - name: toolchain
        run: gcc --version

      # -count=4 on the relay itself: a race that loses the interleaving most
      # of the time still has to lose it four times to slip through.
      - name: go test -race (pipeproxy)
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=4 ./internal/pipeproxy/...

      - name: go test -race (all packages)
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...

      # checkptr validates unsafe.Pointer arithmetic — the other half of #166's
      # hypothesis, where an abandoned overlapped IO's OVERLAPPED struct is Go
      # heap memory the OS may still write to. Cheap, and catches what -race
      # does not.
      - name: go test -d=checkptr
        run: go test -gcflags=all=-d=checkptr -count=1 ./...
